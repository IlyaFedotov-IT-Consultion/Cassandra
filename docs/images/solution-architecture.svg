<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">Cassandra solution architecture</title><desc id="desc">The React workspace talks to a Fastify API whose process also runs workers. The backend uses Postgres for storage, Redis for queues and caches, external evidence providers, and a separate Python judge. In live model mode the judge calls OpenRouter. Shared Zod contracts connect all three applications.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#526579"/></marker></defs>
<rect width="1200" height="940" rx="24" fill="#f6f8fb"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c40}.label{font-size:15px;font-weight:700;letter-spacing:1.6px;fill:#087f79}.heading{font-size:25px;font-weight:700}.body{font-size:19px;fill:#526579}.small{font-size:16px;fill:#526579}.edge{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}</style>
