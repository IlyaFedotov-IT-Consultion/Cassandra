services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cassandra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cassandra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: node:22-alpine
    profiles: ["app"]
    working_dir: /workspace
    command:
      [
        "sh",
        "-lc",
        "apk add --no-cache postgresql-client && corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm --filter @cassandra/api dev",
      ]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cassandra
      REDIS_URL: redis://redis:6379
      JUDGE_BASE_URL: http://judge:8000
      API_PORT: ${API_PORT:-3000}
      # Inside the container the API must listen on every interface to be reachable through the published port.
      API_HOST: 0.0.0.0
      CASSANDRA_CORS_ORIGINS: ${CASSANDRA_CORS_ORIGINS:-http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}}
      CASSANDRA_API_KEY: ${CASSANDRA_API_KEY:-}
      CASSANDRA_ADAPTER_MODE: ${CASSANDRA_ADAPTER_MODE:-fixture}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.API_PORT ?? '3000') + '/ready').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - type: volume
        source: api_root_node_modules_linux
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: api_api_node_modules_linux
        target: /workspace/apps/api/node_modules
        volume:
          nocopy: true
      - type: volume
        source: api_web_node_modules_linux
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - type: volume
        source: api_shared_node_modules_linux
        target: /workspace/packages/shared/node_modules
        volume:
          nocopy: true

  judge:
    image: python:3.12-slim
    profiles: ["app"]
    working_dir: /workspace/services/judge
    command:
      [
        "sh",
        "-lc",
        "python -m pip install --no-cache-dir uv && uv sync --frozen && uv run uvicorn app.main:app --host 0.0.0.0 --port ${JUDGE_PORT:-8000} --reload",
      ]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cassandra
      REDIS_URL: redis://redis:6379
      JUDGE_PORT: ${JUDGE_PORT:-8000}
      CASSANDRA_ADAPTER_MODE: ${CASSANDRA_ADAPTER_MODE:-fixture}
      CASSANDRA_JUDGE_LLM: ${CASSANDRA_JUDGE_LLM:-fake}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_JUDGE_MODELS: ${OPENROUTER_JUDGE_MODELS:-openai/gpt-6.1-sol@high,anthropic/claude-opus-5.5@high,google/gemini-4-argon@high,deepseek/deepseek-v4.1-flash-1017@high}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-openai/gpt-6.1-sol}
      OPENROUTER_JUDGE_REASONING_EFFORT: ${OPENROUTER_JUDGE_REASONING_EFFORT:-high}
      OPENROUTER_CROSS_EXAMINER_MODEL: ${OPENROUTER_CROSS_EXAMINER_MODEL:-anthropic/claude-opus-5.5}
      OPENROUTER_CROSS_EXAMINER_REASONING_EFFORT: ${OPENROUTER_CROSS_EXAMINER_REASONING_EFFORT:-high}
      OPENROUTER_SEARCH_MODEL: ${OPENROUTER_SEARCH_MODEL:-perplexity/sonar-pro-search}
      OPENROUTER_UTILITY_MODEL: ${OPENROUTER_UTILITY_MODEL:-anthropic/claude-haiku-5.5}
      OPENROUTER_UTILITY_REASONING_EFFORT: ${OPENROUTER_UTILITY_REASONING_EFFORT:-low}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, urllib.request; port = os.environ.get('JUDGE_PORT', '8000'); response = urllib.request.urlopen(f'http://127.0.0.1:{port}/health'); sys.exit(0 if response.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "${JUDGE_PORT:-8000}:8000"
    volumes:
      - .:/workspace
      - type: volume
        source: judge_venv_linux
        target: /workspace/services/judge/.venv
        volume:
          nocopy: true

  web:
    image: node:22-alpine
    profiles: ["app"]
    working_dir: /workspace
    command:
      [
        "sh",
        "-lc",
        "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cassandra/web dev",
      ]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      CI: "true"
      VITE_API_BASE_URL: http://api:3000
      WEB_PORT: ${WEB_PORT:-5173}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.WEB_PORT ?? '5173') + '/').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - type: volume
        source: web_root_node_modules_linux
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web_api_node_modules_linux
        target: /workspace/apps/api/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web_web_node_modules_linux
        target: /workspace/apps/web/node_modules
        volume:
          nocopy: true
      - type: volume
        source: web_shared_node_modules_linux
        target: /workspace/packages/shared/node_modules
        volume:
          nocopy: true

volumes:
  postgres_data:
  api_root_node_modules_linux:
  api_api_node_modules_linux:
  api_web_node_modules_linux:
  api_shared_node_modules_linux:
  judge_venv_linux:
  web_root_node_modules_linux:
  web_api_node_modules_linux:
  web_web_node_modules_linux:
  web_shared_node_modules_linux:
