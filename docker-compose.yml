services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cassandra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cassandra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: node:22-alpine
    profiles: ["app"]
    working_dir: /workspace/apps/api
    command: ["sh", "-lc", "echo 'API app scaffold not created yet.' && sleep infinity"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/cassandra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-http://judge:8000}
      API_PORT: ${API_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/workspace

  judge:
    image: python:3.12-slim
    profiles: ["app"]
    working_dir: /workspace/services/judge
    command: ["sh", "-lc", "echo 'Judge service scaffold not created yet.' && sleep infinity"]
    env_file:
      - .env.example
    environment:
      JUDGE_PORT: ${JUDGE_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${JUDGE_PORT:-8000}:8000"
    volumes:
      - .:/workspace

  web:
    image: node:22-alpine
    profiles: ["app"]
    working_dir: /workspace/apps/web
    command: ["sh", "-lc", "echo 'Web app scaffold not created yet.' && sleep infinity"]
    env_file:
      - .env.example
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api:3000}
      WEB_PORT: ${WEB_PORT:-5173}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace

volumes:
  postgres_data:
